[package]
name = "yellowstone-grpc-client"
version = "1.15.0+solana.1.18.11"
edition = "2021"

[dependencies]
solana-sdk = "1.18.11"
solana-client = "1.18.11"
solana-transaction-status = "1.18.11"
async-trait = "0.1"
bincode = "1.3"
bs58 = "0.5"
bytes = "1.5"
futures-util = "0.3"
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.32", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.10", features = ["tls", "tls-roots"] }
tracing = "0.1"